name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Check Python and manifest syntax
        run: |
          python -m py_compile projects.py install.py
          python -m json.tool manifest.json > /dev/null
      - name: Test discovery and launch arguments
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test fuzzy search
        run: node tests/search.test.cjs
