
# karchy's default theme (themes/nulifyer/colors.toml) for the BIOS boot
# menu; packaging/iso/build puts these in place of releng's colours and its
# Arch splash image. Colours are #AARRGGBB, text then background.
MENU COLOR screen       37;40   #ffddc7a1 #ff202020 std
MENU COLOR border       30;40   #ff7c6f64 #ff202020 std
MENU COLOR title        1;33;40 #ffd8a657 #ff202020 std
MENU COLOR sel          7;37;40 #ff202020 #ffd8a657 std
MENU COLOR unsel        37;40   #ffddc7a1 #ff202020 std
MENU COLOR help         37;40   #ffddc7a1 #ff202020 std
MENU COLOR timeout_msg  37;40   #ff7c6f64 #ff202020 std
MENU COLOR timeout      1;33;40 #ffd8a657 #ff202020 std
MENU COLOR msg07        37;40   #ffddc7a1 #ff202020 std
MENU COLOR tabmsg       37;40   #ff7c6f64 #ff202020 std
