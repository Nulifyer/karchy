# karchy-printing: cups-browsed without root (Omarchy's hardening), with
# Omarchy's settings given on the command line, so the cups-browsed
# package's /etc/cups/cups-browsed.conf stays as shipped (a setting made
# there wins over these):
#   CacheDir: state away from /var/cache/cups, which the account CUPS runs
#     print filters as can write; cups-browsed is the only writer here.
#   Queues are created only for driverless IPP printers; queues another CUPS
#     server exports can still be added by hand.
[Service]
ExecStart=
ExecStart=/usr/bin/cups-browsed -o CacheDir=/var/cache/cups-browsed -o CreateIPPPrinterQueues=Driverless -o CreateRemoteCUPSPrinterQueues=No
User=cups-browsed
Group=cups-browsed
CacheDirectory=cups-browsed
CacheDirectoryMode=0750
UMask=0027
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
RestrictSUIDSGID=yes
