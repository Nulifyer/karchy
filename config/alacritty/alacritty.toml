# Alacritty. Colors follow the theme through the import below; karchy reloads
# open windows on a theme switch.
[general]
# The second import holds the font size, which follows Settings › Appearance ›
# Text size. A size of your own under [font] below wins.
import = [
  "~/.local/state/karchy/current/theme/alacritty.toml",
  "~/.local/state/karchy/terminal/alacritty.toml",
]

[font]
# The font follows fontconfig's "monospace", which Settings › Appearance sets.
normal = { family = "monospace" }

# Copy and paste are Ctrl+Shift+C and Ctrl+Shift+V, as in every terminal:
# Ctrl+C interrupts the running program. karchy's Super+C and Super+V and the
# clipboard history send these. Ctrl+Insert and Shift+Insert do the same, as
# on Windows; Shift+Insert would otherwise paste the mouse selection.
[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Insert", mods = "Shift", action = "Paste" },
]
