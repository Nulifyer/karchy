# foot terminal. Colors follow the theme through the include below.
[main]
include=~/.local/state/karchy/current/theme/foot.ini
term=xterm-256color
# The font follows fontconfig's "monospace", which Settings › Appearance sets.
font=monospace:size=10
pad=14x14

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
# Omarchy's universal clipboard keys (Super+C/V) send Ctrl+Insert and
# Shift+Insert, so Shift+Insert pastes the clipboard, not the primary selection.
primary-paste=none
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
