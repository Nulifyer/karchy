# foot terminal. Colors follow the theme through the include below.
[main]
include=~/.local/state/karchy/current/theme/foot.ini
term=xterm-256color
# Font and size: the family is fontconfig's "monospace" and the size follows
# Settings › Appearance › Text size, through the include below. A font= line
# of your own after it wins.
include=~/.local/state/karchy/terminal/foot.ini
pad=14x14

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
# Copy and paste are Ctrl+Shift+C and Ctrl+Shift+V, as in every terminal:
# Ctrl+C interrupts the running program. karchy's Super+C and Super+V and the
# clipboard history send these. Ctrl+Insert and Shift+Insert do the same, as
# on Windows; Shift+Insert would otherwise paste the mouse selection.
primary-paste=none
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste
