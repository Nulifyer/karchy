# karchy: store passwords in the login keyring (oo7, unlocked at login).
# Without this, Brave on Hyprland keeps them in its own weakly protected store.
--password-store=gnome-libsecret

# karchy: decode video on the graphics card (VA-API), not the CPU. Without it
# YouTube's VP9/AV1 is decoded in software, and playback stutters whenever
# something else loads the CPU. AMD and Intel use Mesa's VA-API driver; NVIDIA
# uses nvidia-vaapi-driver (karchy-nvidia), which Chromium only accepts with
# VaapiOnNvidiaGPUs and VaapiIgnoreDriverChecks. The variables it needs
# (LIBVA_DRIVER_NAME, NVD_BACKEND) come from default/hypr/nvidia.lua.
# Check: brave://gpu, "Video Decode: Hardware accelerated".
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks
--ignore-gpu-blocklist
