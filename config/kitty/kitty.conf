# kitty. Colors follow the theme through the include below; karchy reloads
# open windows on a theme switch.
include ~/.local/state/karchy/current/theme/kitty.conf

# The font follows fontconfig's "monospace", which Settings › Appearance sets.
# The size follows Settings › Appearance › Text size, through the include
# below. A font_size line of your own after it wins.
font_family monospace
include ~/.local/state/karchy/terminal/kitty.conf

# karchy's universal clipboard keys (Super+C/V) send Ctrl+Insert and
# Shift+Insert, so these use the clipboard, not the primary selection.
map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard
