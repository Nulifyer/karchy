# vm-install.conf with an encrypted system disk and a second disk (/dev/vdb) erased and encrypted with it:
#   install/karchy-install --config tests/vm-install-data-disk.conf
# Test-only credentials for a throwaway VM; never use this file on real hardware.
# shellcheck source=tests/vm-install.conf
source "$(dirname "${BASH_SOURCE[0]}")/vm-install.conf"
KARCHY_ENCRYPT_DISKS=/dev/vdb
