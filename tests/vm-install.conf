# Answers for an unattended VM test install:
#   install/karchy-install --config tests/vm-install.conf
# Test-only credentials for a throwaway VM; never use this file on real hardware.
KARCHY_DISK=/dev/vda
KARCHY_KEYMAP=us
KARCHY_USER=tester
KARCHY_PASSWORD=karchy-test
KARCHY_FULL_NAME="karchy tester"
KARCHY_EMAIL=tester@example.invalid
KARCHY_HOSTNAME=karchy-vm
KARCHY_TIMEZONE=America/New_York
KARCHY_BEES=no
