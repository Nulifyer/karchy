# Answers for an unattended test install in a Proxmox VM made by
# `tools/vm --pve <host> new`: vm-install.conf with the VM's virtio-scsi disk
# and the repository that `tools/vm --pve <host> repo` tunnels into the guest.
# Test-only credentials for a throwaway VM; never use this file on real hardware.
# shellcheck source=tests/vm-install.conf
source "$(dirname "${BASH_SOURCE[0]}")/vm-install.conf"
KARCHY_DISK=/dev/sda
KARCHY_REPO_SERVER=http://127.0.0.1:8090
