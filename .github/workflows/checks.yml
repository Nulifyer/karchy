# Repository checks on every push and pull request.

name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icons come from the icon map (D-64)
        run: tools/icon-check

  nvidia-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: NVIDIA GPU generations map to the right driver
        run: tools/nvidia-generation-check

  agent-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent skills are linked safely and each one is packaged once (D-115)
        run: tests/agent-skills.sh

  mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirrors that fail a download go last, and nothing else is touched (D-124)
        run: tests/mirrors-demote.sh

  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Font rules, commands and the listed fonts' pictures (D-120)
        run: tests/fonts.sh

  quick-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Quick install app comes from a signed repo or a well-kept AUR package (D-70)
        run: tools/catalog-check
      - name: Quick install search ranks apps as expected
        run: tools/quick-install-search-check

  keyring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The login keyring changes its lock with the oo7 the repositories carry (D-142)
        run: tools/keyring-check

  users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow the user namespace both tests work in (Ubuntu's AppArmor refuses it)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The login keyring follows how its owner gets in (D-142)
        run: tests/keyring-login.sh
      - name: Settings › Users' root helper judges every request (D-139, D-144)
        run: tests/users-settings.sh system/users/users-settings
