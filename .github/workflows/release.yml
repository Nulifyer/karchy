# Build, sign and publish karchy's [karchy] pacman repositories (D-61).
#
#   tag vX.Y.Z         -> stable and rc, plus a GitHub release with notes
#   tag vX.Y.Z-rc.N    -> rc, plus a pre-release with notes
#   push to main       -> nightly
#   daily              -> each channel's native packages (the titlebars), so
#                         they follow Arch's Hyprland updates
#
# One job per channel, each in its own concurrency group, so a repository has
# one writer at a time. (GitHub keeps one pending run per group; a re-run of a
# release whose pending run was displaced republishes it.)
#
# Each job runs packaging/ci/publish in a fresh container of karchy's build
# environment (packaging/container/run), the image local builds use.
#
# Secrets and variables: KARCHY_SIGNING_KEY (secret, armored private key),
# KARCHY_SIGNING_KEY_ID (variable, fingerprint). See packaging/keyring/README.md.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  KARCHY_SIGNING_KEY: ${{ secrets.KARCHY_SIGNING_KEY }}
  KARCHY_SIGNING_KEY_ID: ${{ vars.KARCHY_SIGNING_KEY_ID }}
  publish: >-
    packaging/container/run --writable --env GH_TOKEN --env GH_REPO
    --env KARCHY_SIGNING_KEY --env KARCHY_SIGNING_KEY_ID -- packaging/ci/publish

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: repo-nightly, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Publish nightly
        run: |
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            $publish nightly --native-only
          else
            $publish nightly
          fi

  stable:
    if: github.event_name == 'schedule' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.'))
    runs-on: ubuntu-latest
    concurrency: { group: repo-stable, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Publish stable
        run: |
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            $publish stable --native-only
          else
            $publish stable --version "${GITHUB_REF_NAME#v}"
          fi

  rc:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: { group: repo-rc, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Publish rc
        run: |
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            $publish rc --native-only
            exit 0
          fi
          # v3.0.0 -> 3.0.0, v3.1.0-rc.1 -> 3.1.0rc1
          v=${GITHUB_REF_NAME#v}
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          $publish rc --version "${v/-rc./rc}"

  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rc]
    runs-on: ubuntu-latest
    steps:
      - name: Release notes
        run: |
          prerelease=""
          [[ $GITHUB_REF_NAME == *-rc.* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease --title "karchy ${GITHUB_REF_NAME#v}"
