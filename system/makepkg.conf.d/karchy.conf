# karchy: AUR builds (paru, makepkg) use every core to compile and compress,
# and skip the separate -debug packages. /etc/makepkg.conf is CachyOS's (its
# pacman comes first, D-45), so AUR builds are tuned for this CPU
# (-march=native -O3); this drop-in loads after it. Your ~/.makepkg.conf wins.
MAKEFLAGS="-j$(nproc)"
COMPRESSZST=(zstd -c -T0 -)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
