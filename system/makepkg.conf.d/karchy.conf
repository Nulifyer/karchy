# karchy: AUR builds (paru, makepkg) use every core to compile and compress,
# and skip the separate -debug packages. Arch's /etc/makepkg.conf stays as
# shipped; this drop-in loads after it. Your ~/.makepkg.conf wins.
MAKEFLAGS="-j$(nproc)"
COMPRESSZST=(zstd -c -T0 -)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
