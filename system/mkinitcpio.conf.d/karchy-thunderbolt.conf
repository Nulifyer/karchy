# karchy (from Omarchy): load the Thunderbolt/USB4 driver before the disk
# password prompt, so a keyboard on a USB4 dock works there. Only where the
# kernel builds it as a module: a systemd initramfs copies MODULES into
# modules-load.d as written, so the optional "thunderbolt?" form isn't enough.
if [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename thunderbolt 2>/dev/null) == /* ]]; then
  MODULES+=(thunderbolt)
fi
