# karchy initramfs (D-12): systemd-based, so the LUKS passphrase is unlocked by
# systemd-cryptsetup (sd-encrypt) from rd.luks.* on the kernel command line.
# An install without disk encryption (D-130) has no rd.luks.* there, and
# sd-encrypt then does nothing; the hook stays so every install builds the
# same image from the same packaged file.
# sd-btrfs-overlayfs (limine-mkinitcpio-hook) puts a writable overlay on a
# read-only snapshot booted from the Limine menu, so the desktop can start;
# it does nothing on a normal boot. plymouth asks for the disk password in
# karchy's splash (D-122; "splash" on the kernel line shows it,
# plymouth.enable=0 turns it off). sd-karchy-banner (karchy-settings) draws
# the logo behind the text prompt when Plymouth isn't running, after
# sd-vconsole has set the font.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole plymouth sd-karchy-banner block sd-encrypt filesystems sd-btrfs-overlayfs fsck)
