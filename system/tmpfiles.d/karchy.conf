# The lock shared by `karchy update` (any user) and the weekly mirror ranking
# (root), so the two never run at once (D-29).
f /run/lock/karchy-update 0666 root root -
# One network-share change at a time, for every user: karchy-mount-keep holds
# it while it writes /etc/karchy/smb and /etc/fstab.
f /run/lock/karchy-mount-keep 0666 root root -
# Disk-health warnings from smartd and the btrfs scrub, for the desktop to
# show: written by root (/usr/lib/karchy/disk-health), read by everyone.
d /var/lib/karchy/disk-health 0755 root root -
