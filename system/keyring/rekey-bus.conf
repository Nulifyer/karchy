<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- karchy (D-142): the session bus /usr/lib/karchy/keyring-login gives
     keyring-rekey while a person logs in. oo7-cli asks a bus for the keyring
     service before it opens a keyring file, and the person's own bus and
     daemon aren't running yet. The one service this bus can start is a
     keyring daemon that the caller points at an empty folder
     (XDG_DATA_HOME), so it never opens the keyring being changed. The bus
     and the daemon end with the process namespace they run in. -->
<busconfig>
  <type>session</type>
  <listen>unix:runtime=yes</listen>
  <servicedir>/usr/lib/karchy/keyring-rekey-services</servicedir>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
