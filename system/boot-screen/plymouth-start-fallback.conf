# karchy, in the initramfs only (the sd-karchy-banner hook puts it there as a
# drop-in for plymouth-start.service): when Plymouth's daemon dies before the
# disk is unlocked, the unit fails instead of staying "active", and that
# starts the text password prompt (/usr/lib/karchy/prompt-fallback).
[Unit]
OnFailure=karchy-prompt-fallback.service

[Service]
RemainAfterExit=no
