# karchy-nvidia: no hibernation on NVIDIA machines (D-78). The driver is loaded
# in the initramfs (early KMS), and on the resume boot it refuses to freeze the
# GPU, so the kernel throws the saved image away and boots fresh: the session
# and anything unsaved are lost. Still the case in driver 620 (NVIDIA
# open-gpu-kernel-modules issue #1343); no module option fixes it. Suspend is
# unaffected. To try hibernation anyway, override this file with one of the
# same name in /etc/systemd/sleep.conf.d/ setting these back to yes.
[Sleep]
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
