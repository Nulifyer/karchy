# karchy-nvidia: a laptop's lid suspends (karchy-laptop would suspend, then
# hibernate, which NVIDIA machines can't; see sleep.conf.d/40-karchy-nvidia.conf).
# Installed as 40-karchy-nvidia.conf: after 30-karchy-laptop.conf, so it wins,
# and before Settings › Power's 60-karchy-settings.conf and the user's own.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
