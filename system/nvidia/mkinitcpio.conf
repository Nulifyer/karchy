# karchy-nvidia: load NVIDIA's modules in the initramfs (early KMS), so the
# LUKS prompt and the boot come up on the NVIDIA framebuffer at the panel's
# native resolution, with no handoff flicker. chwd does this on CachyOS;
# karchy has no chwd. nouveau stays out: nvidia-utils blacklists it, and
# modconf carries that blacklist into the initramfs.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
