# karchy-laptop (D-86): bees runs only on AC power. It doesn't start at boot
# on battery; 90-karchy-bees-power.rules stops and starts it as the charger
# comes and goes. Installed as 50-karchy-ac-only.conf; a drop-in for
# karchy-bees.service that sorts later can say otherwise.
[Unit]
ConditionACPower=true
