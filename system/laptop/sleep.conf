# karchy laptop (D-32): suspend-then-hibernate sleeps first and hibernates after
# 2 hours asleep, so a laptop left closed doesn't run its battery flat.
# HibernateOnACPower=no (systemd 257+): plugged in, it stays suspended; the
# countdown starts when AC is disconnected.
[Sleep]
HibernateDelaySec=2h
HibernateOnACPower=no
