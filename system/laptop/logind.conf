# karchy laptop (D-32): closing the lid suspends, then hibernates after 2
# hours on battery (sleep.conf.d/karchy-laptop.conf). On AC the 2 hours only
# start counting once the charger is pulled, so a laptop unplugged while
# asleep doesn't run flat. Docked with an external display it does nothing
# (logind's default).
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
