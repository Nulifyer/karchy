# karchy: what a laptop does when the battery is about to run out.
# Installed as /etc/UPower/UPower.conf.d/50-karchy-laptop.conf; a file there
# with a higher number overrides it.
#
# UPower's own default (CriticalPowerAction=Auto) asks logind to "sleep",
# which is a plain suspend on a machine that cannot hibernate: the battery
# then runs out during the suspend and unsaved work is lost. Hibernate saves
# the session to disk and powers off; where the machine cannot hibernate,
# UPower powers it off instead, which at least shuts down cleanly.
#
# The levels match the shell's warnings (battery.low and battery.critical in
# shell.json, 15 and 5): the action level sits under the critical warning, so
# the warning comes first, and above UPower's default of 2 because writing the
# hibernation image takes power an old battery may not have left at 2%. UPower
# acts 20 seconds after the level is reached. Keep the three in descending
# order, or UPower falls back to its defaults for all of them.
[UPower]
UsePercentageForPolicy=true
PercentageLow=15.0
PercentageCritical=5.0
PercentageAction=3.0
CriticalPowerAction=Hibernate
