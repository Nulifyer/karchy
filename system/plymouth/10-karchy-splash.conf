# karchy (D-122): Plymouth runs only when the kernel line asks for the splash.
# Without this, a boot without "splash" still starts Plymouth, which then asks
# for the disk password as plain text among unit messages and prints every
# unit at shutdown. With it, taking "splash" off the kernel line (or adding
# plymouth.enable=0) gives karchy's text boot screen and systemd's own
# password prompt. Installed for plymouth-start (also in the initramfs, by
# the sd-karchy-banner hook) and for the units that start Plymouth at
# shutdown.
[Unit]
ConditionKernelCommandLine=splash
