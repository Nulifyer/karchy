# karchy: the shutdown splash without Pango. plymouthd runs until the very end
# of a shutdown, and its Pango label plugin (loaded to test text rendering
# for the console viewer) maps fontconfig's cache in /var/cache/fontconfig, so
# /var/cache, a subvolume of its own, failed to unmount ("target is busy") on
# every shutdown and reboot. Without label-pango.so Plymouth tries its
# FreeType label, whose fonts exist only in the initramfs, so it draws no text
# at shutdown; karchy's splash there is pictures only (the mark and the
# tiles). Installed for the units that start Plymouth at shutdown.
[Service]
InaccessiblePaths=-/usr/lib/plymouth/label-pango.so
