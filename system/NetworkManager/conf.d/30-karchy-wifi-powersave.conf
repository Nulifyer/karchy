# Keep Wi-Fi power save off. An idle radio that naps answers 20-300 ms late
# when traffic resumes, and some firmware (Intel BE200/BE211, MediaTek MT7922)
# drops the link outright. It costs a fraction of a watt on battery.
# 2 = off, 3 = on. A file of the same name in /etc/NetworkManager/conf.d/
# replaces this one.
[connection]
wifi.powersave = 2
