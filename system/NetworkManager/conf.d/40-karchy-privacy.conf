# karchy (user 2026-11-16): less identifying on networks you don't control.
# No hostname in DHCP requests, so a café's router doesn't log this
# computer's name (a home router lists it by its hardware address instead),
# and IPv6 connections use temporary addresses that change over time rather
# than one address the same everywhere. A profile's own setting wins
# (nmcli connection modify <name> ipv4.dhcp-send-hostname yes).
[connection]
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
ipv6.ip6-privacy=2
