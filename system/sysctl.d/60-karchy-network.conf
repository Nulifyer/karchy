# karchy's network tuning. A file of the same name in /etc/sysctl.d/, or a
# later-sorting one that sets the same key, wins.

# Answer ARP only for the interface's own address, and announce from it. With
# a dock's Ethernet and Wi-Fi on the same network, the kernel default lets each
# answer for the other's address, so traffic can stay on Wi-Fi when the cable
# is plugged in.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2

# Probe for a smaller packet size when a connection stalls. SSH and VPN
# sessions then keep working on networks that silently drop large packets
# (common on hotel Wi-Fi and in tunnels). Normal links never notice.
net.ipv4.tcp_mtu_probing = 1

# BBR paces sending to the measured bandwidth and delay instead of pushing
# until packets drop, so uploads (backups, pushes, video calls) hold up on
# lossy or long links with less lag meanwhile. fq is the queue BBR paces
# through. The tcp_bbr module is loaded by modules-load.d/karchy-bbr.conf.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
