# karchy: what a scrub found reaches the desktop. btrfs-progs' unit only
# logs, and exits 3 for errors it couldn't repair, 0 for ones it repaired.
# After every run, however it ended, karchy's helper reads the scrub's
# counters and records a warning when there were errors (see the helper).
# Installed as btrfs-scrub@.service.d/10-karchy-disk-health.conf.
[Service]
ExecStopPost=/usr/lib/karchy/disk-health scrub %f
