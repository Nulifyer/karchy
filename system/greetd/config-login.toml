# karchy (D-130): an install without disk encryption. karchy's login screen asks for the password at boot and after logging
# out (/usr/lib/karchy/greeter; the text greeter when it can't start). The
# login goes through karchy's PAM service, which hands the password to the
# keyring (D-131).
[terminal]
vt = 1

[general]
service = "karchy-login"

# The greeter's own session keeps greetd's plain service: the keyring module
# is for the person logging in.
[default_session]
command = "/usr/lib/karchy/greeter"
user = "greeter"
service = "greetd"
