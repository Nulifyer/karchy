# karchy (D-13, D-130): an encrypted install. After the disk is unlocked, go
# straight into the Hyprland session. Logging out shows karchy's login screen (/usr/lib/karchy/greeter; the text greeter
# when it can't start).
[terminal]
vt = 1

[initial_session]
command = "/usr/lib/karchy/session"
user = "@USER@"

[default_session]
command = "/usr/lib/karchy/greeter"
user = "greeter"
