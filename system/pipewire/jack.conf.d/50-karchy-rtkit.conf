# Ask rtkit for realtime directly, as PipeWire's own pipewire.conf does, rather
# than through xdg-desktop-portal. The portal reads rtkit's realtime budget
# once, at its start; when that read fails it reports a budget of zero, and
# module-rt applies that as a hard RLIMIT_RTTIME of 0, which the kernel
# enforces with SIGKILL as soon as a thread runs realtime. The shell is such a
# client, and everything it starts inherits the limit. Without rtkit, a client
# gets realtime only if its own limits allow it, and never a zero limit.
# Flatpak apps read their runtime's own jack.conf and are not affected.
# (Omarchy b58e5b999, #16824.) A file of the same name in
# /etc/pipewire/jack.conf.d/ replaces this one.
module.rt.args = {
  rtportal.enabled = false
}
