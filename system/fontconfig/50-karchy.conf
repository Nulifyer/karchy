<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- karchy's font defaults, simplified from Omarchy's 50-omarchy.conf for an
     English-only system (D-49). The monospace font chosen in Settings › Fonts
     (`karchy font set`) is the file included below, in karchy's own state
     (D-120). The user's ~/.config/fontconfig/ loads after this file
     (50-user.conf): a rule there that puts a family first for "monospace"
     (mode="prepend_first" binding="strong") wins over both. -->
<fontconfig>
  <!-- CSS's ui-monospace is the monospace font. Before the rules below, so
       they see the "monospace" this adds. -->
  <alias>
    <family>ui-monospace</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- The font chosen with `karchy font set`: the same rule as the one
       below, for the chosen family. It comes first, so its family ends up
       ahead of the default. fontconfig can't read XDG_STATE_HOME, so the
       path is fixed. -->
  <include ignore_missing="yes">~/.local/state/karchy/fontconfig/font.conf</include>

  <!-- The monospace font everything shares: the shell, terminals and code
       editors, and monospace text in GTK and Qt apps. It goes right before
       "monospace": asking for the generic family gives this font, asking for
       a font by name still gives that font, and "monospace" stays in place
       for the rules that follow, here and in later files. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Websites asking for the platform UI font get Noto Sans. -->
  <alias>
    <family>system-ui</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>

  <!-- Wherever a font lacks the glyph: Nerd Font icons from the symbols font
       (ttf-nerd-fonts-symbols-mono, a dependency of karchy), so they don't
       depend on which text font is chosen or installed, then color emoji. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
