<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- karchy's font defaults, simplified from Omarchy's 50-omarchy.conf for an
     English-only system (D-49). `karchy-font-set` writes the user's choice to
     ~/.config/fontconfig/conf.d/60-karchy-font.conf, which loads later and
     wins; a hand-written ~/.config/fontconfig/fonts.conf loads after that. -->
<fontconfig>
  <!-- The monospace font everything shares: terminal, shell, Qt and GTK apps. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Websites asking for the platform UI font get Noto Sans. -->
  <alias>
    <family>system-ui</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- Color emoji wherever a font lacks the glyph; Nerd Font icons in sans text. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
