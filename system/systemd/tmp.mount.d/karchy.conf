# karchy /tmp (D-11, revised 2026-11-16): tmpfs capped at half of RAM, as
# systemd's default; all of RAM can deadlock the machine (kernel tmpfs docs)
# and crowd out hibernation. Cold pages swap out to zswap and the swap file;
# systemd-tmpfiles ages files out after 10 days. usrquota keeps systemd's
# per-user limit where the kernel supports it.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=50%%,nr_inodes=1m,x-systemd.graceful-option=usrquota
