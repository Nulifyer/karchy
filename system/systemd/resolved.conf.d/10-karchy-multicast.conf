# .local names (printers, a NAS, other computers) are answered by avahi, which
# nsswitch asks before resolved (install/setup.sh). resolved's own responders
# would answer and announce this machine's name a second time, so names clash
# (laptop-2.local). avahi itself runs only on trusted networks
# (karchy-network-privacy), so nothing announces the name on public Wi-Fi.
# A file of the same name in /etc/systemd/resolved.conf.d/ replaces this one.
[Resolve]
LLMNR=no
MulticastDNS=no
