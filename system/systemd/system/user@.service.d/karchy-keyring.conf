# karchy (D-57): hand the user's login keyring key to their user manager, where
# oo7-daemon.service imports it as oo7.keyring-encryption-password. A missing
# key is harmless: ImportCredential skips it and the keyring stays locked.
[Unit]
Wants=karchy-keyring-key@%i.service
After=karchy-keyring-key@%i.service

[Service]
ImportCredential=karchy.keyring.%i:oo7.keyring-encryption-password
