# karchy (from Omarchy):
# - Programs start allowed 65,536 open files instead of 1,024 (games under
#   Wine/Proton, IDEs, file watchers); the hard ceiling stays 524,288.
# - systemd handles 30 mount events a second instead of 5, so many drives and
#   network shares don't delay boot.
[Manager]
DefaultLimitNOFILE=65536:524288
ManagerEnvironment=SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST=30
