# karchy (from CachyOS): a service that won't stop gets 10 s, not 90 s, so one
# stuck service can't hold shutdown or reboot for a minute and a half. Units
# that need longer ask for it themselves (karchy's VMs ask for 15 s).
# A file of the same name in /etc/systemd/system.conf.d/ replaces this one.
[Manager]
DefaultTimeoutStopSec=10s
