# karchy (from Omarchy): several key servers with short timeouts, so importing
# a signing key (gpg, pacman-key, AUR builds) doesn't fail when one server is
# down. ~/.gnupg/dirmngr.conf overrides this.
keyserver hkps://keyserver.ubuntu.com
keyserver hkps://pgp.surfnet.nl
keyserver hkps://keys.mailvelope.com
keyserver hkps://keyring.debian.org
keyserver hkps://pgp.mit.edu
connect-quick-timeout 4
