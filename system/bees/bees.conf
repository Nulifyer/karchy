# karchy's defaults for bees, the background deduplicator of the system disk
# (D-86). This file belongs to the karchy-settings package and updates replace
# it; put your own values in /etc/karchy/bees.conf, which is read after this
# file and wins. Restart karchy-bees.service after a change.
#
# To switch bees off for good: systemctl disable --now karchy-bees.service

# "no" keeps the service from running bees. karchy can ship "no" in an update
# if a kernel release turns out to be unsafe with bees.
ENABLED=yes

# Size of the hash table in bytes (a multiple of 131072), or "auto": 256 MiB
# per TiB of disk, between 64 MiB and 1 GiB and at most 1/16 of the memory.
# The table stays in memory while bees runs. It is created once; a different
# explicit size later resizes it and makes bees scan the disk again.
DB_SIZE=auto

# Options for bees. karchy's choices:
#   --workaround-btrfs-send  never rewrite snapper's read-only snapshots
#   --keep-prealloc          leave preallocated space alone (VM disks, databases)
#   --thread-count 2         two worker threads; the service caps the CPU time
#   --verbose 5              no file names in the journal
#   --settle-delay 300       leave new data alone for 5 minutes: build output and
#                            downloads that are deleted or still being written
#                            are never read; bees also waits this long after
#                            each start
OPTIONS="--strip-paths --verbose 5 --thread-count 2 --workaround-btrfs-send --keep-prealloc --settle-delay 300"
